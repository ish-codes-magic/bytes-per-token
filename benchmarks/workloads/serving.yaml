# Serving workloads (read by fastserve.serving.workloads.Workload.from_config).
# Prompts are seeded random token ids; outputs are forced to an exact length (ignore_eos).

chat:                    # one user chatting: short prompts, medium answers
  input_len: {kind: lognormal, median: 100, sigma: 0.8, low: 16, high: 512}
  output_len: 256
  num_requests: 30

throughput:              # many users, ShareGPT-like mix: long-tailed prompts and answers
  input_len: {kind: lognormal, median: 256, sigma: 1.0, low: 16, high: 4096}
  output_len: {kind: lognormal, median: 192, sigma: 0.8, low: 16, high: 1024}
  num_requests: 512

decode:                  # fixed lengths: with N closed-loop users, the batch is N sequences decoding in step
  input_len: 128
  output_len: 256
  num_requests: 768

saturation:              # the same mix, enough requests to hold the engine full for about two minutes
  input_len: {kind: lognormal, median: 256, sigma: 1.0, low: 16, high: 4096}
  output_len: {kind: lognormal, median: 192, sigma: 0.8, low: 16, high: 1024}
  num_requests: 2000

long_8k:                 # RAG-style: a long retrieved context, a short answer
  input_len: 8192
  output_len: 64
  num_requests: 8
long_16k:
  input_len: 16384
  output_len: 64
  num_requests: 8
long_32k:
  input_len: 32768
  output_len: 64
  num_requests: 6

shared_prefix:           # an agent: a long shared system prompt + tools, then short turns
  shared_prefix_len: 2048
  input_len: {kind: lognormal, median: 64, sigma: 0.7, low: 8, high: 256}
  output_len: 64
  num_requests: 300

capacity:                # many users with long prompts: the KV cache, not compute, caps how many run at once
  input_len: 4096
  output_len: 256
  num_requests: 288

multi_turn:              # chat apps: 4 system prompts, 32 conversations of 4 turns, each turn extends the last
  shared_prefix_len: 1536
  prefixes: 4
  turns: 4
  reply_len: 192         # stands in for the assistant's previous answer
  input_len: {kind: lognormal, median: 96, sigma: 0.6, low: 16, high: 512}
  output_len: 64
  num_requests: 128
  seed: 1                # seed 0 would reuse shared_prefix's prefix tokens: a false cross-workload cache hit
